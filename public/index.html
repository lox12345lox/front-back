<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <title>Бургерная</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="container">
    <div id="authBlock">
      <div class="tabs">
        <button id="tab-login" class="tab active">Вход</button>
        <button id="tab-register" class="tab">Регистрация</button>
      </div>

      <form id="registerForm" class="form hidden">
        <div class="form-group">
          <label>Email</label>
          <input type="email" id="regEmail" required />
          <div class="error" id="emailError"></div>
        </div>
        <div class="form-group">
          <label>Телефон</label>
          <input type="text" id="regPhone" placeholder="+7 (999) 123-45-67" required />
          <div class="error" id="phoneError"></div>
        </div>
        <div class="form-group">
          <label>Пароль</label>
          <input type="password" id="regPassword" required />
        </div>
        <button type="submit" class="btn">Зарегистрироваться</button>
      </form>

      <form id="loginForm" class="form">
        <div class="form-group">
          <label>Email</label>
          <input type="email" id="loginEmail" required />
        </div>
        <div class="form-group">
          <label>Пароль</label>
          <input type="password" id="loginPassword" required />
        </div>
        <button type="submit" class="btn">Войти</button>
      </form>

      <div id="message" class="message hidden"></div>
    </div>

    <div id="burgerBlock" class="hidden">
      <h2>Вы вошли!</h2>
      
      <button id="showDataBtn" class="btn">Показать данные</button>
      <div id="userData" class="hidden"></div>

      <br>
      <button id="logoutBtn" class="btn">Выйти</button>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
